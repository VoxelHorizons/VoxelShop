name: Build and test VoxelShop
on:
  push:
    branches: [main, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - name: Compile and run tests
        run: mvn --batch-mode --no-transfer-progress clean verify
      - name: Verify Paper 26.2 plugin metadata
        run: |
          set -euo pipefail
          jar_file=$(compgen -G 'target/VoxelShop-*-mc26.2.jar' | head -n 1)
          test -n "$jar_file"
          unzip -p "$jar_file" plugin.yml | grep -Fx "api-version: '26.2'"
          unzip -l "$jar_file" 'org/voxelhorizons/shop/VoxelShop.class' | grep 'VoxelShop.class'
      - name: Upload server plugin artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoxelShop-mc26.2
          path: target/VoxelShop-*-mc26.2.jar
